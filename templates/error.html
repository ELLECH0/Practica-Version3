{% extends "base.html" %}
{% block title %}Ошибка {{ code }} СпортПрокат{% endblock %}

{% block content %}
<section class="wrap error-page">
  <p class="error-page__code">{{ code }}</p>
  <h1>{{ message }}</h1>
  <p class="muted">Вернитесь на главную или откройте каталог</p>
  <div class="hero__actions">
    <a class="btn btn--primary" href="{{ url_for('index') }}">На главную</a>
    <a class="btn btn--ghost" href="{{ url_for('catalog') }}">В каталог</a>
  </div>
</section>
{% endblock %}
