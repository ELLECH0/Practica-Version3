<text x="40" y="30" font-size="15" font-weight="700" fill="#16211b">СпортПрокат — ER-диаграмма базы данных (SQLite)</text>
<text x="1040" y="30" text-anchor="end" font-size="11" fill="#67716a">PK — первичный ключ · FK — внешний ключ · UQ — уникальное</text>
<text x="40" y="684" font-size="11" fill="#67716a">Одна категория — много позиций каталога; одна позиция — много единиц склада; бронь связывает клиента, позицию и (после выдачи) конкретную единицу.</text>
